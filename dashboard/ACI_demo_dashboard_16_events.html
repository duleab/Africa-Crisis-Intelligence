<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Africa Crisis Intelligence Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#07111f;--panel:#0d1b2b;--line:#22364f;--text:#edf6ff;--muted:#96aac4;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}
header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:4px}
main{max-width:1500px;margin:auto;padding:18px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.card{padding:14px}.label{font-size:12px;color:var(--muted)}.value{font-size:28px;font-weight:800}
.toolbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:14px}input,select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px}
.layout{display:grid;grid-template-columns:1.5fr .75fr;gap:14px}.head{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}#map{height:520px}#detail{padding:14px;max-height:520px;overflow:auto}.title{font-size:19px;font-weight:800}.meta{font-size:12px;color:var(--muted);margin:6px 0 12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:11px;margin:2px}
.section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.section h3{font-size:11px;text-transform:uppercase;color:var(--muted)}.section p{font-size:13px;line-height:1.5}
.table{margin-top:14px}.tablewrap{overflow:auto;max-height:360px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 12px;border-bottom:1px solid #1b2c43;text-align:left}th{color:var(--muted);font-size:11px}tbody tr{cursor:pointer}tbody tr:hover{background:#10243a}.amber{color:#fbbf24}
@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>Africa Crisis Intelligence</h1><div class="sub">East Africa crisis monitoring, verification & early warning — Demo Dashboard</div></div><div class="sub">Static demo dataset</div></header>
<main>
<div class="cards">
<div class="card"><div class="label">Unique events</div><div class="value" id="total"></div></div>
<div class="card"><div class="label">Alerts ≥50%</div><div class="value" id="alerts"></div></div>
<div class="card"><div class="label">Conflict / tension</div><div class="value" id="conflict"></div></div>
<div class="card"><div class="label">Drought</div><div class="value" id="drought"></div></div>
<div class="card"><div class="label">Countries represented</div><div class="value" id="countries"></div></div>
</div>
<div class="toolbar"><input id="search" placeholder="Search event or place..."><select id="country"><option value="">All countries</option></select><select id="type"><option value="">All crisis types</option></select><select id="source"><option value="">All sources</option></select><select id="conf"><option value="0">All confidence</option><option value="0.5">≥50%</option><option value="0.6">≥60%</option><option value="0.65">≥65%</option></select></div>
<div class="layout"><div class="panel"><div class="head">Regional crisis map</div><div id="map"></div></div><div class="panel"><div class="head">Event intelligence</div><div id="detail"></div></div></div>
<div class="panel table"><div class="head">Recorded event stream</div><div class="tablewrap"><table><thead><tr><th>Event</th><th>Location</th><th>Source</th><th>Confidence</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const E=[{"id": "1", "title": "Tigray urges global intervention amid signs of renewed conflict", "type": "Conflict", "location": "Tigray, Ethiopia", "country": "Ethiopia", "lat": 13.5, "lon": 39.5, "confidence": 0.6, "source": "NEWS", "precision": "ADMIN1", "summary": "Tigray authorities called for urgent international intervention as tensions appeared to move toward renewed conflict. The event remains based on limited independent corroboration."}, {"id": "2", "title": "Reported drone strikes in Mekelle heighten conflict concerns", "type": "Conflict", "location": "Mekelle, Ethiopia", "country": "Ethiopia", "lat": 13.4967, "lon": 39.4753, "confidence": 0.53, "source": "NEWS", "precision": "CITY", "summary": "A news report described drone strikes in Mekelle. No confirmed casualty figure or responsible actor was available in the alert evidence, so the event remains unverified."}, {"id": "3", "title": "Tigray cancels Ashenda festival over drone attack fears", "type": "Conflict", "location": "Tigray, Ethiopia", "country": "Ethiopia", "lat": 13.5, "lon": 39.5, "confidence": 0.53, "source": "NEWS", "precision": "ADMIN1", "summary": "Regional authorities reportedly cancelled the Ashenda festival because of concern about possible drone attacks. The alert remains marked as needing verification."}, {"id": "4", "title": "Orange-level drought affecting Eritrea, Ethiopia, Kenya and Somalia", "type": "Drought", "location": "Horn of Africa", "country": "Eritrea, Ethiopia, Kenya, Somalia", "lat": 6.8, "lon": 41.5, "confidence": 0.63, "source": "GDACS", "precision": "REGIONAL", "summary": "GDACS reported an orange-level multi-country drought affecting Eritrea, Ethiopia, Kenya and Somalia, with limited detail on affected populations and on-the-ground impact."}, {"id": "5", "title": "Drought in Uganda's Karamoja region: hunger peaks as El Niño arrives", "type": "Drought", "location": "Karamoja, Uganda", "country": "Uganda", "lat": 2.9, "lon": 34.6, "confidence": 0.6, "source": "NEWS", "precision": "REGIONAL", "summary": "A World Food Programme report highlighted drought and severe hunger in Uganda's Karamoja region as El Niño conditions intensified."}, {"id": "6", "title": "Renewed tensions between Ethiopia and Tigray risk regional escalation", "type": "Emerging Crisis", "location": "Tigray, Ethiopia", "country": "Ethiopia", "lat": 13.5, "lon": 39.5, "confidence": 0.57, "source": "NEWS", "precision": "ADMIN1", "summary": "Recent reporting described renewed tensions between Ethiopia's federal government and Tigray authorities, with concern about wider regional effects."}, {"id": "7", "title": "Clashes reported between armed groups near Bor, Jonglei State", "type": "Conflict", "location": "Bor, South Sudan", "country": "South Sudan", "lat": 6.2115, "lon": 31.5565, "confidence": 0.58, "source": "NEWS", "precision": "CITY", "summary": "Local media reports intermittent clashes between community militias near Bor. Casualty figures unclear; no corroboration from secondary sources yet."}, {"id": "8", "title": "Al-Shabaab attack on military base reported near Afgoye", "type": "Conflict", "location": "Afgoye, Somalia", "country": "Somalia", "lat": 2.3452, "lon": 45.1214, "confidence": 0.65, "source": "NEWS, GOV", "precision": "CITY", "summary": "Multiple outlets report an overnight raid on a government military position near Afgoye, Lower Shabelle. Fatality figures unconfirmed."}, {"id": "9", "title": "Karamoja food insecurity worsens as harvest fails — WFP warns of hunger peak", "type": "Drought", "location": "Karamoja, Uganda", "country": "Uganda", "lat": 3.4, "lon": 34.9, "confidence": 0.68, "source": "UN WFP, NEWS", "precision": "REGIONAL", "summary": "Failed rains compound existing drought; El Niño arrival expected to disrupt the October–December season further."}, {"id": "10", "title": "Below-average rains forecast for southern and eastern Ethiopia", "type": "Drought", "location": "Somali & Oromia regions, Ethiopia", "country": "Ethiopia", "lat": 6.5, "lon": 43.5, "confidence": 0.61, "source": "GDACS", "precision": "REGIONAL", "summary": "Seasonal forecast indicates delayed onset of rains; water stress expected in pastoral zones."}, {"id": "11", "title": "Flash floods displace hundreds in Nyando, Kisumu County", "type": "Flood", "location": "Kisumu, Kenya", "country": "Kenya", "lat": -0.0917, "lon": 34.768, "confidence": 0.62, "source": "GDACS, NEWS", "precision": "CITY", "summary": "Heavy rainfall over the Lake Victoria basin causes localized flooding; displacement estimates are approximately 400 households. No fatalities confirmed."}, {"id": "12", "title": "Heavy rains trigger flooding in Dar es Salaam low-lying areas", "type": "Flood", "location": "Dar es Salaam, Tanzania", "country": "Tanzania", "lat": -6.7924, "lon": 39.2083, "confidence": 0.55, "source": "NEWS", "precision": "CITY", "summary": "Single-source report of urban flooding following intense overnight rainfall. Infrastructure damage reported, casualties unconfirmed."}, {"id": "13", "title": "Cholera cases rising in Juba and surrounding counties", "type": "Epidemic", "location": "Juba, South Sudan", "country": "South Sudan", "lat": 4.8594, "lon": 31.5713, "confidence": 0.6, "source": "WHO, NEWS", "precision": "CITY", "summary": "Health ministry reports increasing suspected cholera cases linked to seasonal rains and limited clean water access."}, {"id": "14", "title": "Rwanda–DRC border tensions prompt precautionary measures at Goma/Gisenyi crossing", "type": "Emerging Crisis", "location": "Gisenyi, Rwanda", "country": "Rwanda", "lat": -1.6989, "lon": 29.2561, "confidence": 0.54, "source": "NEWS", "precision": "CITY", "summary": "Reports of restricted cross-border movement amid regional diplomatic friction. Single source, unverified."}, {"id": "15", "title": "Burundi announces emergency food distribution in drought-affected provinces", "type": "Food Security", "location": "Kirundo & Muyinga, Burundi", "country": "Burundi", "lat": -2.5845, "lon": 30.0959, "confidence": 0.57, "source": "NEWS, GOV", "precision": "ADMIN1", "summary": "Government response to failed harvests in Kirundo and Muyinga provinces; international agencies mobilizing support."}, {"id": "16", "title": "Djibouti reports water rationing amid regional drought spillover", "type": "Drought", "location": "Djibouti (rural districts)", "country": "Djibouti", "lat": 11.5721, "lon": 42.5485, "confidence": 0.56, "source": "NEWS", "precision": "COUNTRY", "summary": "Authorities introduce rationing in rural districts as Horn of Africa drought conditions extend eastward."}];
const map=L.map('map').setView([6,39],4.5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map);
const $=id=>document.getElementById(id),pct=v=>Math.round(v*100);let filtered=[...E],markers=new Map();
function color(e){if(e.type==='Conflict')return '#f59e0b';if(e.type==='Drought')return '#ef4444';if(e.type==='Flood')return '#3b82f6';return '#8b5cf6'}
function init(){const ts=[...new Set(E.map(e=>e.type))].sort();$('type').innerHTML='<option value="">All crisis types</option>'+ts.map(x=>`<option>${x}</option>`).join('');const cs=[...new Set(E.flatMap(e=>e.country.split(',').map(x=>x.trim())))].sort();$('country').innerHTML='<option value="">All countries</option>'+cs.map(x=>`<option>${x}</option>`).join('');const ss=[...new Set(E.flatMap(e=>e.source.split(',').map(x=>x.trim())))].sort();$('source').innerHTML='<option value="">All sources</option>'+ss.map(x=>`<option>${x}</option>`).join('');['search','type','country','source','conf'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',apply));apply();show(E[7])}
function apply(){const q=$('search').value.toLowerCase(),t=$('type').value,c=$('country').value,s=$('source').value,m=Number($('conf').value||0);filtered=E.filter(e=>(e.title+' '+e.location+' '+e.country+' '+e.source+' '+e.summary).toLowerCase().includes(q)&&(!t||e.type===t)&&(!c||e.country.split(',').map(x=>x.trim()).includes(c))&&(!s||e.source.split(',').map(x=>x.trim()).includes(s))&&e.confidence>=m);cards();draw();rows()}
function cards(){$('total').textContent=filtered.length;$('alerts').textContent=filtered.filter(e=>e.confidence>=.5).length;$('conflict').textContent=filtered.filter(e=>e.type!=='Drought').length;$('drought').textContent=filtered.filter(e=>e.type==='Drought').length;$('countries').textContent=new Set(filtered.flatMap(e=>e.country.split(',').map(x=>x.trim()))).size}
function draw(){layer.clearLayers();markers.clear();const b=[];filtered.forEach(e=>{b.push([e.lat,e.lon]);const m=L.circleMarker([e.lat,e.lon],{radius:e.precision==='REGIONAL'?11:8,color:color(e),fillColor:color(e),fillOpacity:e.precision==='REGIONAL'?.45:.82,weight:2,dashArray:e.precision==='REGIONAL'?'4 4':null}).bindTooltip(`${e.type} · ${e.location} · ${pct(e.confidence)}%`).on('click',()=>show(e)).addTo(layer);markers.set(e.id,m)});if(b.length>1)map.fitBounds(b,{padding:[30,30],maxZoom:7})}
function show(e){$('detail').innerHTML=`<div class="title">${e.title}</div><div class="meta">${e.location}</div><div><span class="badge">${e.type}</span><span class="badge">${e.source}</span><span class="badge">${pct(e.confidence)}% confidence</span><span class="badge">Geo: ${e.precision}</span></div><div class="section"><h3>Intelligence summary</h3><p>${e.summary}</p></div><div class="section"><h3>Status</h3><p><strong class="amber">ACTIONABLE / ANALYZE</strong><br>Threshold for analyst attention is 50%. Human verification is still required.</p></div>`}
function rows(){$('rows').innerHTML=filtered.map(e=>`<tr data-id="${e.id}"><td><strong>${e.type}</strong><br><span class="sub">${e.title}</span></td><td>${e.location}</td><td>${e.source}</td><td class="amber">${pct(e.confidence)}%</td><td class="amber">ACTIONABLE / ANALYZE</td></tr>`).join('');[...$('rows').querySelectorAll('tr')].forEach(r=>r.onclick=()=>show(E.find(e=>e.id===r.dataset.id)))}
init();
</script></body></html>
